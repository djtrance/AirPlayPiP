name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Test source preparation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Fetch pinned native dependencies
        run: python3 scripts/bootstrap_native.py
      - name: Verify Kotlin, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: airplay-pip-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
